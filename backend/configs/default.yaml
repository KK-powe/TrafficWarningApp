model:
  device: auto
  # 航拍小目标常低于 0.25，降低阈值以保留车辆候选框。
  confidence: 0.15
  iou: 0.50
  image_size: 1280
  # 使用更低的建轨阈值；无 ID 的原始检测框仍会显示。
  tracker: bytetrack_traffic.yaml
  tracked_classes:
    - pedestrian
    - people
    - bicycle
    - car
    - van
    - truck
    - tricycle
    - awning-tricycle
    - bus
    - motor

tracking:
  history_length: 60
  stale_after_frames: 90

# 三类规则依赖具体视频的方向、区域和信号灯时间标定，默认关闭。
# 只有启用并完成标定的规则才会产生黄色可疑目标和红色违规目标。
rules:
  wrong_way:
    enabled: false
    target_classes: [bicycle, motor, tricycle, awning-tricycle]
    expected_direction: [1.0, 0.0]
    minimum_history: 8
    minimum_displacement_pixels: 25
    maximum_direction_cosine: -0.25
    warning_minimum_history: 4
    warning_minimum_displacement_pixels: 12
    suspicious_direction_cosine: 0.20
    cooldown_seconds: 3
    severity: 25

  restricted_zone:
    enabled: false
    polygon:
      - [0.05, 0.55]
      - [0.95, 0.55]
      - [0.95, 0.95]
      - [0.05, 0.95]
    prohibited_classes: [car, van, bus, truck]
    warning_margin_pixels: 30
    cooldown_seconds: 3
    severity: 20

  red_light:
    enabled: false
    stop_line:
      - [0.15, 0.62]
      - [0.85, 0.62]
    red_intervals_seconds:
      - [0.0, 10.0]
    target_classes: [bicycle, motor, tricycle, awning-tricycle, car, van, bus, truck]
    minimum_movement_pixels: 8
    warning_distance_pixels: 40
    cooldown_seconds: 5
    severity: 40

# 车辆数量只用于统计，不参与风险分数、边框颜色或目标框颜色。
risk:
  event_window_seconds: 3
  event_weights:
    wrong_way: 25
    restricted_zone: 20
    red_light: 40
  levels:
    medium: 25
    high: 50
    critical: 75
